<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deployment Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>Deployment Demo v1</h1>
      <p class="lead">Auto-deployed from GitHub to Vercel after CI passes.</p>

      <section class="card" aria-live="polite">
        <h2>Backend status</h2>
        <p><span id="status-dot" class="dot unknown"></span><span id="status-text">Checking...</span></p>
      </section>
    </main>

    <footer>
      Last deployed <time id="built-at">unknown</time>
      <span id="commit-wrap" hidden> &middot; commit <code id="commit"></code></span>
    </footer>

    <!-- config.js is generated by scripts/build.js; it is absent when opening this file directly. -->
    <script src="config.js"></script>
    <script src="main.js"></script>
  </body>
</html>
